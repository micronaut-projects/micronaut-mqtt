plugins {
    id 'java-library'
    id("io.micronaut.build.internal.mqtt-tests")
    id("io.micronaut.build.internal.common")
}

dependencies {
    annotationProcessor(mn.micronaut.inject.java)
    api(mnTest.micronaut.test.junit5)
    api(projects.micronautMqttCore)
    api(libs.awaitility)
    implementation(platform(mnTest.boms.testcontainers))
    implementation(libs.testcontainers)
    implementation(libs.testcontainers.hivemq)
    api(mnReactor.micronaut.reactor)
}

spotless {
    groovy {
        targetExclude("**/test/**")
    }
}

tasks.withType(Checkstyle) {
    enabled = false
}

// the shared specs run in the test suites, whose coverage is not reported for this project: it is not analysed as
// production code
rootProject.pluginManager.withPlugin("org.sonarqube") {
    sonar {
        skipProject = true
    }
}
