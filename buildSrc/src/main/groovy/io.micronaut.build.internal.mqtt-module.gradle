plugins {
    id "io.micronaut.build.internal.mqtt-base"
    id "io.micronaut.build.internal.module"
    id("org.sonatype.gradle.plugins.scan")
}
String ossIndexUsername = System.getenv("OSS_INDEX_USERNAME") ?: project.properties["ossIndexUsername"]
String ossIndexPassword = System.getenv("OSS_INDEX_PASSWORD") ?: project.properties["ossIndexPassword"]
boolean sonatypePluginConfigured = ossIndexUsername != null && ossIndexPassword != null
if (sonatypePluginConfigured) {
    ossIndexAudit {
        username = ossIndexUsername
        password = ossIndexPassword
        excludeCoordinates = [
                "org.bouncycastle:bcprov-jdk15on:1.70", // no version patched https://ossindex.sonatype.org/component/pkg:maven/org.bouncycastle/bcprov-jdk15on
                "org.bouncycastle:bcpkix-jdk15on:1.70" // no version patched https://ossindex.sonatype.org/component/pkg:maven/org.bouncycastle/bcpkix-jdk15on
        ]
    }
}

dependencies {
    annotationProcessor(mnValidation.micronaut.validation.processor)
    implementation(mnValidation.micronaut.validation)

    api projects.micronautMqttCore

    compileOnly(mn.micronaut.management)

    testImplementation(mn.micronaut.management)
    testImplementation(mn.reactor)
    testImplementation(projects.testSuiteUtils)
    testImplementation(mnSerde.micronaut.serde.jackson)
}
